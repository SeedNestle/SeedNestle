<div class="container">
  <!-- Form Section -->
  <div *ngIf="!showPreview" class="form-section">
    <h2>Create Quotation</h2>
    
    <form [formGroup]="quotationForm">
      <!-- Customer Details -->
      <div class="form-group">
        <label>Customer Name *</label>
        <input 
          type="text" 
          formControlName="customerName" 
          placeholder="Enter customer name"
          class="form-control">
        <span class="error" *ngIf="quotationForm.get('customerName')?.touched && quotationForm.get('customerName')?.invalid">
          Customer name is required
        </span>
      </div>

      <!-- Items Section -->
      <div class="items-section">
        <div class="section-header">
          <h3>Items</h3>
          <button type="button" class="btn-add" (click)="addItem()">+ Add Item</button>
        </div>

        <div formArrayName="items">
          <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="item-card">
            <div class="item-header">
              <span>Item {{ i + 1 }}</span>
              <button type="button" class="btn-remove" (click)="removeItem(i)" *ngIf="items.length > 1">
                Remove
              </button>
            </div>

            <div class="item-row">
              <div class="form-group">
                <label>Item Name *</label>
                <input type="text" formControlName="name" placeholder="Product/Service name" class="form-control">
              </div>

              <div class="form-group">
                <label>Quantity *</label>
                <input type="number" formControlName="quantity" min="1" class="form-control">
              </div>

              <div class="form-group">
                <label>Price (₹) *</label>
                <input type="number" formControlName="price" min="0" step="0.01" class="form-control">
              </div>

              <div class="form-group">
                <label>Total (₹)</label>
                <input 
                  type="text" 
                  [value]="calculateItemTotal(item.value)" 
                  readonly 
                  class="form-control readonly">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="summary-section">
        <h3>Total Amount</h3>
        <div class="total-amount">
          ₹{{ calculateGrandTotal() | number:'1.2-2' }}
        </div>
      </div>

      <!-- Terms and Conditions -->
      <div class="form-group">
        <label>Terms & Conditions</label>
        <textarea 
          formControlName="termsAndConditions" 
          rows="4" 
          class="form-control"
          placeholder="Enter terms and conditions..."></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
        <button type="button" class="btn btn-primary" (click)="previewQuotation()">Preview & Download</button>
      </div>
    </form>
  </div>

  <!-- Preview Section -->
  <div *ngIf="showPreview" class="preview-section">
    <div class="preview-actions">
      <button type="button" class="btn btn-secondary" (click)="closePreview()">← Back to Edit</button>
      <button type="button" class="btn btn-primary" (click)="downloadPDF()">📥 Download PDF</button>
    </div>
